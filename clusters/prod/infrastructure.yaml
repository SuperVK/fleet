apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # No encrypted resources in ./infrastructure; decryption lives on the apps
  # Kustomization (which has the sops-age secretRef). Keeping it off here means
  # infrastructure reconciles even before the sops-age secret exists.
