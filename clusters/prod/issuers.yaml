apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: issuers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/issuers
  prune: true
  # MUST be a separate Kustomization from `infrastructure`: the ClusterIssuer
  # dry-run fails until cert-manager's CRDs exist, and a dry-run failure aborts
  # the whole apply — co-located with the HelmRelease it deadlocks.
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
