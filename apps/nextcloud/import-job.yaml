# One-shot OneDrive -> Nextcloud data import.
#
# Committed with suspend: false, so Flux reconciles it and runs it as soon as
# it is pushed. rclone copy skips files already present in the target, so an
# interrupted run picks up where it left off. To rerun after a completed or
# failed run: kubectl -n nextcloud delete job onedrive-import — Flux recreates
# it on the next apps reconcile. Watch: kubectl logs -n nextcloud job/onedrive-import -f
#
# NOTE the target path: the chart mounts the PVC with subPaths, so the PVC
# root holds html/ data/ config/ ... and the Nextcloud data dir is
# <PVC>/data/<user>/files — hence /data/data/<user>/files/Photos.
# The job runs as uid 33 (www-data), so files land correctly owned and no
# chown step is needed.
apiVersion: batch/v1
kind: Job
metadata:
  name: onedrive-import
  namespace: nextcloud
spec:
  suspend: false
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: rclone
          image: rclone/rclone:1.75.1 # pinned; Renovate bumps
          env:
            - name: RCLONE_CONFIG
              value: /config/rclone/rclone.conf
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              rclone copy "onedrive:Photography/2. Export" "/data/data/victor@vtkl.nl/files/Photography" \
                --include "*.{jpg,jpeg,png,heic,heif,webp}" \
                --transfers 4 --checkers 8 --tpslimit 8 \
                --retries 5 --retries-sleep 30s \
                --log-level INFO
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rclone-conf
              mountPath: /config/rclone
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            # fullname("nextcloud") + "-nextcloud" — verified against chart 9.2.6
            # templates/nextcloud-pvc.yaml
            claimName: nextcloud-nextcloud
        - name: rclone-conf
          secret:
            secretName: rclone-config
