# Mealie — recipe manager (recipes.victorklomp.nl).
# Plain manifests on purpose: the published Helm charts are community-maintained,
# and the app is a single container (Python API + prebuilt frontend) with SQLite
# — Deployment + Service + PVC + Ingress is all it needs.
# Env reference: https://docs.mealie.io/documentation/getting-started/installation/backend-config/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  labels:
    app.kubernetes.io/name: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      containers:
        - name: mealie
          # Pinned; Renovate bumps (multi-arch image, arm64 included).
          image: ghcr.io/mealie-recipes/mealie:v3.29.0
          env:
            - name: BASE_URL
              # Used for the OIDC callback/redirect URL; must match the ingress.
              value: https://recipes.victorklomp.nl
            - name: HOST_IP
              # CIDRs whose X-Forwarded-For/Proto headers uvicorn trusts — the
              # Traefik -> mealie hop arrives from the pod CIDR. Default "*"
              # trusts forwarding headers from EVERY source; without this the
              # OIDC redirect is built as http and login breaks.
              value: 10.42.0.0/16
            - name: TZ
              # DAILY_SCHEDULE_TIME (default 23:45, the daily backup) is local
              # time, so pin the zone instead of the UTC default.
              value: Europe/Amsterdam
            - name: ALLOW_SIGNUP
              # Default (false since v1.4); pinned to document intent — nobody
              # self-registers; users come in via OIDC auto-provisioning.
              value: "false"
            - name: ALLOW_PASSWORD_LOGIN
              # OIDC-only: hide the username+password fields in the UI. The
              # seeded first user's credentials are the public upstream
              # defaults (no env override exists since v1.4), so keep the UI on
              # OIDC and neutralize that account after first login (README
              # §Day-2). NOTE: the /api/auth/token endpoint still accepts the
              # default password until that account's auth method is switched.
              value: "false"
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: https://sso.victorklomp.nl/.well-known/openid-configuration
            - name: OIDC_ADMIN_GROUP
              # Pocket ID group whose members become Mealie admins on login;
              # create it there (same name) and put your user in it.
              value: mealie-admins
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mealie
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealie
                  key: oidc-client-secret
          ports:
            - name: http
              containerPort: 9000
          # /api/app/about is the endpoint the image's own HEALTHCHECK
          # (docker/healthcheck.sh) probes — public, no auth needed.
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  labels:
    app.kubernetes.io/name: mealie
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mealie
  ports:
    - name: http
      port: 9000
      targetPort: http
