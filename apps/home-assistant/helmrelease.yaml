# HelmRelease values verified against home-assistant chart 0.3.80
# (appVersion 2026.9.1) — values.yaml:
# https://github.com/pajikos/home-assistant-helm-chart/blob/main/charts/home-assistant/values.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: home-assistant
      version: "0.3.80" # pinned; Renovate opens PRs
      sourceRef:
        kind: HelmRepository
        name: pajikos
        namespace: flux-system
  values:
    # Hetzner VPS, not a home server: no LAN to discover, so hostNetwork is
    # off (it only helps mDNS/SSDP discovery inside a home network) and HA is
    # reached exclusively via the ingress. Integrations that need to see the
    # local network do not exist here; everything talks outbound (cloud APIs,
    # MQTT, webhooks over this ingress).
    hostNetwork: false

    env:
      - name: TZ
        value: Europe/Amsterdam

    # The chart seeds configuration.yaml (and, on fresh installs only, the
    # HA 2026.8+ /config/.storage/http file) with use_x_forwarded_for and
    # trusted_proxies. The pod CIDR 10.42.0.0/16 covers BOTH hops in front of
    # HA — Traefik and the oauth2-proxy SSO gate — same rationale as the
    # Nextcloud trusted_proxies.
    configuration:
      enabled: true
      trusted_proxies:
        - 10.42.0.0/16

    persistence:
      enabled: true
      storageClass: local-path
      size: 8Gi

    # Chart default is 8080; 8123 is HA's own port, which keeps the
    # oauth2-proxy upstream URL obvious. Nothing else about the Service
    # changes.
    service:
      port: 8123

    # The public ingress is NOT the chart's: apps/home-assistant/ingress.yaml
    # owns ha.victorklomp.nl and routes it through oauth2-proxy (Pocket ID
    # SSO gate) to this release's Service. ingress.external is a pure flag in
    # this chart (verified against 0.3.80 templates): it renders no resource
    # but keeps the configmap's http-storage.json seed alive, so a fresh
    # install still gets trusted_proxies. With ingress.enabled=false alone
    # that seed would be dropped and every request through the proxies would
    # hit HA's "untrusted proxy" 400.
    ingress:
      enabled: false
      external: true

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
