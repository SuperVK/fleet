apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-id
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - ingress.yaml
  # SOPS-encrypted with the repo age key. Unlike nextcloud there is nothing
  # user-specific in it: the ENCRYPTION_KEY was generated once
  # (openssl rand -base64 32) and committed — restoring the app needs this
  # secret AND the PVC together (see README §Restore).
  - secrets.sops.yaml
