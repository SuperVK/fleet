apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: librechat
resources:
  - namespace.yaml
  - pvc.yaml
  - mongodb.yaml
  - deployment.yaml
  - ingress.yaml
  # librechat.yaml (custom OpenRouter endpoint) as a ConfigMap.
  - config.yaml
  # SOPS-encrypted with the repo age key; JWT/CREDS secrets ship generated,
  # the Pocket ID OIDC client credentials and the OpenRouter key ship
  # CHANGE_ME placeholders until filled (README §Day-2,
  # secrets.sops.yaml.example).
  - secrets.sops.yaml
