# HTTPS for LibreChat: OIDC flow requires secure contexts; traefik +
# cert-manager provide it, same as the other apps.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: librechat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - chat.victorklomp.nl
      secretName: librechat-tls
  rules:
    - host: chat.victorklomp.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: librechat
                port:
                  name: http
